server:
  port: 8087


consultant:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    user-secret-key: ${JWT_SECRET_KEY}
    # 设置jwt过期时间
    user-ttl: 7200000
    # 设置前端传递过来的令牌名称
    user-token-name: authentication

dashscope:
  api-key: ${API_KEY}
  embedding-model: text-embedding-v3

app:
  storage:
    # 相对路径会解析到 AiConsultant 模块下（见 DocumentServiceImpl），勿依赖 user.dir
    local-dir: uploads
  rag:
    redis:
      index-name: embedding-index   # 与 Vector / BM25 共用；可按环境改为 embedding-index-dev / -prod
    retriever:
      max-results: 8       # 默认召回数量
      min-score: 0.75      # 默认最低相似度阈值（仅向量通道）
    eval:
      # 启动参数加 --eval 时必填：--app.rag.eval.knowledge-id=<知识库ID>
      # knowledge-id:
      golden-set-path: docs/eval/golden-set.json
  # 副模型：主模型（langchain4j.open-ai.chat-model）失败时由 LLMService 降级调用
  llm:
    secondary:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${SECONDARY_API_KEY:${API_KEY}}
      model-name: ${SECONDARY_MODEL_NAME:qwen-turbo}
      log-requests: true
      log-responses: true


langchain4j:
  open-ai:
    chat-model: # 主模型
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${API_KEY}
      model-name: qwen-plus
      log-requests: true
      log-responses: true
    streaming-chat-model: #流式模型配置
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${API_KEY}
      model-name: qwen-plus
      log-requests: true
      log-responses: true
    embedding-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${EMBEDDING_API_KEY}
      model-name: text-embedding-v3
      log-requests: true
      log-responses: true
      max-segments-per-batch: 10

 
  community:
    redis:
      # 关闭自动配置，改由 VectorStoreConfig 手动注册（否则会创建无 metadataKeys 的 Bean，检索时 metadata 恒为空）
      enabled: false
      host: localhost
      port: 6379
logging:
  # [%X{traceId}] 从 MDC 读取，由 TraceIdFilter 在请求入口写入
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{traceId}] [%thread] %-5level %logger{36} - %msg%n"
  level:
    dev.langchain4j: debug

spring:
  data:
    redis:
      host: localhost
      port: 6379
  main:
    allow-bean-definition-overriding: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_consultant?serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}  
    password: ${DB_PASSWORD} 

  servlet:
    multipart:
      # 单个文件最大 50MB
      max-file-size: 50MB
      # 单次请求所有文件总大小
      max-request-size: 50MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true
